<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novel World</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#6A0DAD;
color:white;
padding:30px;
text-align:center;
}

.container{
width:90%;
max-width:1000px;
margin:30px auto;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.card h2{
color:#6A0DAD;
margin-bottom:10px;
}

.button{
display:inline-block;
background:#6A0DAD;
color:white;
padding:10px 20px;
text-decoration:none;
border-radius:6px;
}

footer{
text-align:center;
padding:20px;
color:#777;
}
</style>

</head>

<body>

<header>
<h1>Novel World</h1>
<p>Read the Best Translated Novels Online</p>
</header>

<div class="container">

<div class="card">
<h2>Novel Title</h2>
<p>A short description of the novel will appear here.</p>
<a class="button" href="#">Start Reading</a>
</div>

<div class="card">
<h2>Another Novel</h2>
<p>A short description of the novel will appear here.</p>
<a class="button" href="#">Start Reading</a>
</div>

</div>

<footer>
© 2026 Novel World. All rights reserved.
</footer>

</body>
</html>
